

name: Large Repository SCSS Agent Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write


jobs:
  scss-token-review:
    name: Scan changed SCSS files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout SCSS token agent
        uses: actions/checkout@v4
        with:
          repository: Reeya833/scss-design-token-agent
          ref: main
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SCSS token checker
        id: checker
        working-directory: repo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from collections import OrderedDict
          from pathlib import Path

          repo_root = Path.cwd()

          token_sources = [
              repo_root / "core" / "scss" / "_settings.scss",
              repo_root / "core" / "scss" / "_variables.scss",
          ]

          token_pattern = re.compile(
              r"^\s*(\$[\w-]+)\s*:\s*([^;]+?)(?:\s*!default)?\s*;\s*$"
          )
          literal_pattern = re.compile(
              r"^(?:#[0-9a-fA-F]{3,8}|\d+(?:\.\d+)?px)$"
          )

          generated_token_file = Path(
              os.environ.get("RUNNER_TEMP", str(repo_root))
          ) / "scss-real-token-definitions.scss"

          tokens_by_value = OrderedDict()

          for source_file in token_sources:
              if not source_file.exists():
                  raise FileNotFoundError(
                      f"Token source file not found: {source_file}"
                  )

              for line in source_file.read_text(encoding="utf-8").splitlines():
                  match = token_pattern.match(line)
                  if not match:
                      continue

                  token_name = match.group(1)
                  token_value = match.group(2).strip()

                  if not literal_pattern.match(token_value):
                      continue

                  tokens_by_value.setdefault(token_value, []).append(token_name)

          generated_lines = []
          for token_value, token_names in tokens_by_value.items():
              for token_name in token_names:
                  generated_lines.append(f"{token_name}: {token_value};")

          generated_token_file.write_text(
              "\n".join(generated_lines) + "\n",
              encoding="utf-8",
          )

          print(
              f"Generated token file: {generated_token_file} "
              f"({len(generated_lines)} tokens)"
          )

          sys.path.insert(0, "../agent/src")

          from scss_token_checker.checker import analyze_scss_file, read_tokens

          unrelated_properties = (
              "backdrop-filter",
              "background-image",
              "box-shadow",
              "filter",
              "transform",
          )

          def is_property_compatible(property_name):
              normalized_name = property_name.lower()
              return not any(
                  normalized_name == unrelated
                  or normalized_name.startswith(f"{unrelated}-")
                  for unrelated in unrelated_properties
              )

          diff = subprocess.run(
              [
                  "git",
                  "diff",
                  "--name-only",
                  os.environ["BASE_SHA"],
                  os.environ["HEAD_SHA"],
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          changed_files = [
              name
              for name in diff.stdout.splitlines()
              if name.endswith(".scss")
              and Path(name)
              not in {
                  Path("core/scss/_settings.scss"),
                  Path("core/scss/_variables.scss"),
              }
          ]

          tokens = read_tokens(str(generated_token_file))
          findings = []

          print(f"Changed SCSS files to scan: {len(changed_files)}")

          for name in changed_files:
              path = repo_root / name

              if not path.is_file():
                  continue

              file_findings = analyze_scss_file(str(path), tokens)
              file_findings = [
                  finding
                  for finding in file_findings
                  if is_property_compatible(finding["property"])
              ]

              for finding in file_findings:
                  finding["file"] = path.relative_to(repo_root).as_posix()

              findings.extend(file_findings)

          report_lines = ["## SCSS Design Token Check", ""]

          if not findings:
              report_lines.append(
                  "No hardcoded values matching existing Tabler design tokens were found."
              )
          else:
              report_lines.extend(
                  [
                      f"Found **{len(findings)}** hardcoded value(s) that match existing Tabler design tokens.",
                      "",
                      "| SCSS file | Line | Property | Hardcoded value | Matching token |",
                      "|---|---:|---|---|---|",
                  ]
              )

              for finding in findings:
                  report_lines.append(
                      f"| `{finding['file']}` "
                      f"| {finding['line']} "
                      f"| `{finding['property']}` "
                      f"| `{finding['value']}` "
                      f"| `{', '.join(finding['tokens'])}` |"
                  )

          report = "\n".join(report_lines)

          Path("scss-token-report.md").write_text(report, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"findings_count={len(findings)}\n")

          print(report)
          print(f"Total findings: {len(findings)}")
          PY

      - name: Post or update PR comment
        if: always() && steps.checker.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(
              "repo/scss-token-report.md", "utf8"
            );

            const marker = "<!-- scss-design-token-check -->";
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail check when findings exist
        if: steps.checker.outputs.findings_count != '0'
        run: |
          echo "SCSS token checker found matching hardcoded values."
          exit 1
