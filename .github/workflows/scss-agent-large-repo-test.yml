
name: Large Repository SCSS Agent Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.scss'
      - '.github/workflows/scss-agent-large-repo-test.yml'
      - 'agent-test/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  scss-token-review:
    name: Scan changed SCSS files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout SCSS token agent
        uses: actions/checkout@v4
        with:
          repository: Reeya833/scss-design-token-agent
          ref: main
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run SCSS token checker
        id: checker
        working-directory: repo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "../agent/src")

          from scss_token_checker.checker import (
              read_tokens,
              analyze_scss_file,
              generate_report,
          )

          repo_root = Path.cwd()
          token_file = repo_root / "agent-test" / "variables.scss"

          if not token_file.exists():
              raise FileNotFoundError(
                  f"Token file not found: {token_file}"
              )

          diff = subprocess.run(
              [
                  "git", "diff", "--name-only",
                  os.environ["BASE_SHA"],
                  os.environ["HEAD_SHA"],
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          changed_files = [
              name for name in diff.stdout.splitlines()
              if name.endswith(".scss")
              and Path(name) != Path("agent-test/variables.scss")
          ]

          tokens = read_tokens(str(token_file))
          findings = []

          print(f"Changed SCSS files to scan: {len(changed_files)}")

          for name in changed_files:
              path = repo_root / name

              if not path.is_file():
                  continue

              file_findings = analyze_scss_file(
                  str(path), tokens
              )

              for finding in file_findings:
                  finding["file"] = path.relative_to(
                      repo_root
                  ).as_posix()

              findings.extend(file_findings)

          report = generate_report(findings)

          Path("scss-token-report.md").write_text(
              report, encoding="utf-8"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"findings_count={len(findings)}\n")

          print(report)
          print(f"Total findings: {len(findings)}")
          PY

      - name: Post or update PR comment
        if: always() && steps.checker.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(
              "repo/scss-token-report.md", "utf8"
            );

            const marker = "<!-- scss-design-token-check -->";
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );

            const existing = comments.find(
              comment =>
                comment.user.type === "Bot" &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail check when findings exist
        if: steps.checker.outputs.findings_count != '0'
        run: |
          echo "SCSS token checker found matching hardcoded values."
          exit 1
