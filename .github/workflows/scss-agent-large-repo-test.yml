
name: Large Repository SCSS Agent Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  scss-token-review:
    uses: Reeya833/scss-design-token-agent/.github/workflows/reusable-scss-review.yml@main
    secrets:
      AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
